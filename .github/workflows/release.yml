name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Кэш libsodium
        uses: actions/cache@v4
        with:
          path: third_party/libsodium-android
          key: sodium-${{ hashFiles('third_party/build-libsodium-android.sh', 'third_party/libsodium-1.0.20.tar.gz') }}

      - name: Установка компонентов Android SDK
        run: |
          # на раннере sdkmanager есть, но не в PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36.1" \
            "build-tools;37.0.0"

      - name: Сборка libsodium
        # на раннере ANDROID_NDK уже задан и указывает на NDK образа, а не на версию проекта
        run: ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358" bash third_party/build-libsodium-android.sh

      - name: Проверка тега и версии
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с versionName v${VERSION_NAME} в app/build.gradle.kts"
            exit 1
          fi

      - name: Раскодирование keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          POMAVPN_KEYSTORE_BASE64: ${{ secrets.POMAVPN_KEYSTORE_BASE64 }}
        run: |
          set +x
          if [ -z "$POMAVPN_KEYSTORE_BASE64" ]; then
            echo "Секрет POMAVPN_KEYSTORE_BASE64 не задан"
            exit 1
          fi
          printf '%s' "$POMAVPN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pomavpn.jks"
          chmod 600 "$RUNNER_TEMP/pomavpn.jks"

      - name: Сборка и тесты
        env:
          POMAVPN_KEYSTORE: ${{ runner.temp }}/pomavpn.jks
          POMAVPN_KEYSTORE_PASSWORD: ${{ secrets.POMAVPN_KEYSTORE_PASSWORD }}
          POMAVPN_KEY_ALIAS: ${{ secrets.POMAVPN_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest

      - name: Удаление keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pomavpn.jks"

      - name: Проверка подписи
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set +x
          EXPECTED="1b323285900637caac227a08f470a8d7ab146949a872aca7ad0c4712c11a4410"
          CERT_SHA256="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | grep 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')"
          if [ "$CERT_SHA256" != "$EXPECTED" ]; then
            echo "SHA-256 сертификата подписи не совпадает с ожидаемым отпечатком"
            exit 1
          fi
          echo "Подпись проверена: отпечаток сертификата совпадает"

      - name: Артефакт APK
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          DST="PomaVPN-${VERSION_NAME}.apk"
          cp "$SRC" "$DST"
          sha256sum "$DST" > "$DST.sha256"
          cat "$DST.sha256"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v7
        with:
          name: pomavpn-apk
          path: |
            PomaVPN-*.apk
            PomaVPN-*.apk.sha256
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Скачивание артефакта
        uses: actions/download-artifact@v8
        with:
          name: pomavpn-apk
          path: artifacts

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          name: PomaVPN ${{ github.ref_name }}
          files: |
            artifacts/PomaVPN-*.apk
            artifacts/PomaVPN-*.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
